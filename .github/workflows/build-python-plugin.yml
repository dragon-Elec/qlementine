name: Build Python Plugin

on:
  workflow_dispatch:

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libgl1-mesa-dev \
            libxkbcommon-dev
            
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          
      - name: Create Plugin Source
        run: |
          # Write the Plugin C++ code
          cat << 'EOF' > lib/src/QlementinePlugin.cpp
          #include <QStylePlugin>
          #include <oclero/qlementine/style/QlementineStyle.hpp>

          class QlementinePlugin : public QStylePlugin {
              Q_OBJECT
              Q_PLUGIN_METADATA(IID "org.qt-project.Qt.QStyleFactoryInterface" FILE "qlementine.json")

          public:
              QlementinePlugin(QObject *parent = nullptr) : QStylePlugin(parent) {}

              QStyle *create(const QString &key) override {
                  if (key.compare("Qlementine", Qt::CaseInsensitive) == 0) {
                      auto* style = new oclero::qlementine::QlementineStyle();
                      style->setAnimationsEnabled(true);
                      return style;
                  }
                  return nullptr;
              }
          };

          #include "QlementinePlugin.moc"
          EOF
          
          # Write the Plugin JSON metadata
          cat << 'EOF' > lib/src/qlementine.json
          {
              "Keys": [ "Qlementine" ]
          }
          EOF
          
          # Append to root CMakeLists.txt
          cat << 'EOF' >> CMakeLists.txt
          
          add_library(qlementineplugin MODULE lib/src/QlementinePlugin.cpp)
          target_link_libraries(qlementineplugin PRIVATE Qt6::Core Qt6::Gui Qt6::Widgets Qt6::Svg qlementine)
          EOF

      - name: Build Plugin and Showcase
        run: |
          mkdir build
          cd build
          cmake -DQLEMENTINE_SANDBOX=OFF -DQLEMENTINE_SHOWCASE=ON ..
          make -j$(nproc) qlementineplugin showcase
          
      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libqlementineplugin.so
          path: build/libqlementineplugin.so

      - name: Upload Showcase Artifact
        uses: actions/upload-artifact@v4
        with:
          name: showcase
          path: build/showcase/showcase
